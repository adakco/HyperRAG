networks:
  rag_net:
    name: ${NETWORK_NAME:-rag_net}
    driver: bridge

volumes:
  nats_data: {}
  qdrant_data: {}
  neo4j_data: {}
  neo4j_logs: {}
  grafana_data: {}
  prom_data: {}
  loki_data: {}
  tempo_data: {}
  postgres_data: {}
  redis_data: {}
  minio_data: {}
  minio_config: {}

services:
  # ---------- Messaging (NATS + JetStream) ----------
  nats:
    image: nats:2.10.14-alpine
    command: ["-js", "-m", "8222"]
    ports:
      - "${NATS_PORT:-4222}:4222"
      - "${NATS_MONITOR:-8222}:8222"
    networks: ["rag_net"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8222/varz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    volumes:
      - nats_data:/data
    labels:
      - "alloy.exporter.discovery=true"

  # ---------- Vector DB (Qdrant) ----------
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports: ["${QDRANT_PORT:-6333}:6333"]
    networks: ["rag_net"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:6333/readyz >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    volumes:
      - qdrant_data:/qdrant/storage
    labels:
      - "alloy.exporter.discovery=true"

  # ---------- Graph DB (Neo4j) ----------
  neo4j:
    image: neo4j:5.23
    ports:
      - "${NEO4J_HTTP:-7474}:7474"
      - "${NEO4J_BOLT:-7687}:7687"
    environment:
      - NEO4J_AUTH=${NEO4J_USER}/${NEO4J_PASS}
      - NEO4J_dbms_memory_heap_initial__size=1G
      - NEO4J_dbms_memory_heap_max__size=2G
      - NEO4J_dbms_memory_pagecache_size=1G
      - NEO4J_apoc_export_file_enabled=true
      - NEO4J_apoc_import_file_enabled=true
      - NEO4J_PLUGINS=["apoc"]
    networks: ["rag_net"]
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER} -p ${NEO4J_PASS} 'RETURN 1' >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 20
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./init/neo4j-init.cypher:/init/neo4j-init.cypher:ro
    labels:
      - "alloy.exporter.discovery=true"

  # ---------- Postgres ----------
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks: ["rag_net"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB} >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    volumes:
      - postgres_data:/var/lib/postgresql
    labels:
      - "alloy.exporter.discovery=true"
      - "alloy.postgres.instance=${POSTGRES_USER}@postgres:5432/${POSTGRES_DB}"

  # ---------- Redis ----------
  redis:
    image: redis:7
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks: ["rag_net"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    volumes:
      - redis_data:/data
    labels:
      - "alloy.exporter.discovery=true"

  # ---------- Prometheus ----------
  prometheus:
    image: prom/prometheus:v2.54.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=15d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prom_data:/prometheus
    ports: ["${PROM_PORT:-9090}:9090"]
    networks: ["rag_net"]
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    labels:
      - "alloy.exporter.discovery=true"

  # ---------- Grafana ----------
  grafana:
    image: grafana/grafana:12.2.0
    depends_on:
      prometheus:
        condition: service_started
      alloy:
        condition: service_started
    ports: ["${GRAFANA_PORT:-3001}:3000"]
    networks: ["rag_net"]
    environment:
      - GF_SERVER_ROOT_URL=${GF_SERVER_ROOT_URL:-http://localhost:3001}
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_AUTH_ANONYMOUS_ENABLED=false
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"

  # ---------- Loki (logs) ----------
  loki:
    image: grafana/loki:3.1.1
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports: ["${LOKI_PORT:-3100}:3100"]
    networks: ["rag_net"]
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    labels:
      - "alloy.exporter.discovery=true"

  # ---------- Promtail (log shipper) ----------
  promtail:
    image: grafana/promtail:3.1.1
    command: ["-config.file=/etc/promtail/config.yml"]
    volumes:
      - ./promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock
    networks: ["rag_net"]
    depends_on:
      loki:
        condition: service_started
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"

  # ---------- Tempo (traces store/UI) ----------
  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo/tempo.yml"]
    volumes:
      - ./tempo.yml:/etc/tempo/tempo.yml:ro
      - tempo_data:/var/tempo
    ports: ["${TEMPO_PORT:-3200}:3200"]
    networks: ["rag_net"]
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    labels:
      - "alloy.exporter.discovery=true"

  # ---------- Grafana Alloy (OTLP Collector) ----------
  alloy:
    image: grafana/alloy:latest
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    ports:
      - "12345:12345"
      - "4317:4317"
      - "4318:4318"
    networks: ["rag_net"]
    depends_on:
      tempo:
        condition: service_started
      loki:
        condition: service_started
    volumes:
      - ./alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"

  # ---------- MinIO (S3) ----------
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001" --address ":9000"
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_PROMETHEUS_URL=http://prometheus:9090
      - MINIO_PROMETHEUS_JOB_ID=minio
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    networks: ["rag_net"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"
    volumes:
      - minio_data:/data
      - minio_config:/root/.minio
    labels:
      - "alloy.exporter.discovery=true"

  # ---------- MinIO mc (init buckets) ----------
  minio-mc:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: ["/init/mc-init.sh"]
    environment:
      - MINIO_ROOT_USER=${MINIO_ROOT_USER}
      - MINIO_ROOT_PASSWORD=${MINIO_ROOT_PASSWORD}
      - MINIO_BUCKETS=${MINIO_BUCKETS}
      - MINIO_PUBLIC_BUCKET=${MINIO_PUBLIC_BUCKET}
    networks: ["rag_net"]
    volumes:
      - ./init/mc-init.sh:/init/mc-init.sh:ro
    restart: "no"
    logging:
      driver: "json-file"
      options:
        max-size: "${DOCKER_LOG_MAX_SIZE:-50m}"
        max-file: "${DOCKER_LOG_MAX_FILE:-3}"

