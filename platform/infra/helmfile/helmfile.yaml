repositories:
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: minio
    url: https://helm.min.io/
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: nats
    url: https://nats-io.github.io/k8s/helm/charts/
  - name: jaegertracing
    url: https://jaegertracing.github.io/helm-charts

environments:
  default:
    values:
      - environment: development
  staging:
    values:
      - environment: staging
  production:
    values:
      - environment: production

releases:
  # Infrastructure
  - name: minio
    namespace: hyperrag
    chart: minio/minio
    version: 5.0.7
    values:
      - values/minio.yaml

  - name: postgres
    namespace: hyperrag
    chart: bitnami/postgresql
    version: 12.5.6
    values:
      - values/postgres.yaml

  - name: qdrant
    namespace: hyperrag
    chart: ./charts/qdrant
    version: 0.1.0
    values:
      - values/qdrant.yaml

  - name: nats
    namespace: hyperrag
    chart: nats/nats
    version: 0.19.14
    values:
      - values/nats.yaml

  - name: redis
    namespace: hyperrag
    chart: bitnami/redis
    version: 17.11.3
    values:
      - values/redis.yaml

  - name: neo4j
    namespace: hyperrag
    chart: neo4j/neo4j
    version: 5.7.0
    values:
      - values/neo4j.yaml

  # Monitoring
  - name: prometheus
    namespace: hyperrag
    chart: prometheus-community/kube-prometheus-stack
    version: 45.7.1
    values:
      - values/prometheus.yaml

  - name: grafana
    namespace: hyperrag
    chart: grafana/grafana
    version: 6.57.4
    values:
      - values/grafana.yaml

  - name: jaeger
    namespace: hyperrag
    chart: jaegertracing/jaeger
    version: 0.71.3
    values:
      - values/jaeger.yaml

  - name: loki
    namespace: hyperrag
    chart: grafana/loki
    version: 5.8.9
    values:
      - values/loki.yaml

  # HyperRAG Services
  - name: hyperrag
    namespace: hyperrag
    chart: ./charts/hyperrag
    version: 1.0.0
    values:
      - values/hyperrag.yaml
    needs:
      - hyperrag/minio
      - hyperrag/postgres
      - hyperrag/qdrant
      - hyperrag/nats
      - hyperrag/redis
      - hyperrag/neo4j
      - hyperrag/prometheus
      - hyperrag/grafana
      - hyperrag/jaeger
      - hyperrag/loki

helmDefaults:
  wait: true
  timeout: 600
  createNamespace: true
  historyMax: 10
  verify: false
  atomic: true
  cleanupOnFail: true
